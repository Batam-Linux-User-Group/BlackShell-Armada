<!doctype html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Linux Sketchbook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Instrument+Serif:ital@0;1&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
  <link href="book.css" rel="stylesheet">
</head>

<body>
  <div class="app">
    <header id="hdr" class="hdr"></header>

    <section class="hero">
      <h1 class="font-serif-instrument">Buku Sketsa <br><em>Linux.</em></h1>
      <p class="lead font-reader">Pengenalan singkat tentang sistem operasi ini: filosofinya, perangkatnya, dan
        komunitas yang terus menumbuhkannya.</p>
      <div class="tips font-mono-dm">
        <span>🔍 Tarik kacamata pembesar untuk <strong>Zoom optik</strong> (bukan blur)</span>
      </div>
    </section>

    <main class="main">
      <div class="zbar font-mono-dm">
        <button id="zout" class="zb" data-act="zout" title="Perkecil Buku"><svg class="ic i12" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" x2="16.65" y1="21" y2="16.65" />
            <line x1="8" x2="14" y1="11" y2="11" />
          </svg><span>− Zoom</span></button>
        <button id="zin" class="zb" data-act="zin" title="Perbesar Buku"><svg class="ic i12" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8" />
            <line x1="21" x2="16.65" y1="21" y2="16.65" />
            <line x1="11" x2="11" y1="8" y2="14" />
            <line x1="8" x2="14" y1="11" y2="11" />
          </svg><span>+ Zoom</span></button>
        <button class="zb" data-act="zreset" title="Reset Ukuran Standar"><svg class="ic i12" viewBox="0 0 24 24"
            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
            <path d="M3 3v5h5" />
          </svg><span>Reset</span></button>
      </div>
      <div id="book-mount"></div>
      <div id="lens-root"></div>
    </main>

    <section class="idx">
      <div class="idx-h">
        <div>
          <h3 class="font-serif-instrument">Sketchbook pages</h3>
        </div>
        <div class="srch">
          <svg class="ic i14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.3-4.3" />
          </svg>
          <input id="search" type="text" class="font-mono-dm" placeholder="Cari topik atau perintah...">
        </div>
      </div>
      <div id="cards" class="cards"></div>
      <div id="none"></div>
    </section>

    <div id="modal-term"></div>
    <div id="modal-figma"></div>

    <footer class="foot font-mono-dm">
      <div><span>Copyright © 2026 Blackshell Armada. All rights reserved.</span><span>GO OPEN SOURCE</span></div>
    </footer>
  </div>
  <script src="book.js"></script>
  <script src="kacapembesar.js"></script>
  <script src="terminal.js"></script>
  <script src="script.js"></script>

</body>

</html>
